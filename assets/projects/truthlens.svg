<text x="22" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#e6edf3">TruthLens</text>
<text x="380" y="32" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" fill="#e3b341">NLP · LLM</text>

<rect x="30" y="58" width="170" height="136" rx="6" fill="#161b22" stroke="#30363d"/>
<rect x="42" y="70" width="146" height="14" rx="2" fill="#8b949e"/>
<path d="M42 98h146M42 110h120M42 122h140M42 134h100M42 146h146M42 158h90M42 170h130" stroke="#30363d" stroke-width="4"/>
