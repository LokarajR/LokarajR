<svg xmlns="http://www.w3.org/2000/svg" width="400" height="240" viewBox="0 0 400 240" role="img" aria-label="TruthLens: a magnifying glass scans a news article, a 'likely fake' stamp appears and LLaMA 3 explains the verdict">
<title>TruthLens</title>
<rect x="0.5" y="0.5" width="399" height="239" rx="16" fill="#0d1117" stroke="#30363d"/>
