  <animateTransform attributeName="transform" type="translate" values="80 110;150 130;90 160;80 110" dur="4s" repeatCount="indefinite"/></g>
<g transform="rotate(-12 300 92)"><rect x="248" y="72" width="104" height="38" rx="4" fill="none" stroke="#f85149" stroke-width="3"/>
<text x="300" y="98" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="800" fill="#f85149">LIKELY FAKE</text>
<animate attributeName="opacity" values="0;0;1;1" dur="4s" calcMode="discrete" repeatCount="indefinite"/></g>
<rect x="232" y="132" width="152" height="54" rx="10" fill="#161b22" stroke="#e3b341"/>
<text x="244" y="152" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9" fill="#e3b341">LLaMA 3 · why:</text>
