<svg xmlns="http://www.w3.org/2000/svg" width="400" height="240" viewBox="0 0 400 240" role="img" aria-label="Cloud Surveillance: a camera records on motion, the clip flows through Google Cloud, a person is detected and an email alert is sent">
<title>Cloud Surveillance</title>
<rect x="0.5" y="0.5" width="399" height="239" rx="16" fill="#0d1117" stroke="#30363d"/>
<rect x="0.5" y="0.5" width="6" height="239" rx="3" fill="#db61a2"/>
<text x="22" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#e6edf3">Cloud Surveillance</text>
<text x="380" y="32" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" fill="#db61a2">VISION · CLOUD</text>

<g transform="translate(26 92)"><rect width="52" height="34" rx="6" fill="#161b22" stroke="#db61a2" stroke-width="2"/>
<circle cx="26" cy="17" r="9" fill="none" stroke="#db61a2" stroke-width="2"/><path d="M52 10l14-8v30l-14-8" fill="#161b22" stroke="#db61a2" stroke-width="2"/></g>
<text x="30" y="146" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9" fill="#8b949e">motion → clip</text>
<path d="M150 118a18 18 0 0 1 34-10a16 16 0 0 1 28 14a14 14 0 0 1-6 28h-54a16 16 0 0 1-2-32z" fill="#161b22" stroke="#8b949e" stroke-width="2"/>
<text x="180" y="138" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="8" fill="#e6edf3">GCP</text>
<text x="180" y="170" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="8" fill="#8b949e">Pub/Sub · Video AI</text>
<rect x="250" y="80" width="64" height="76" rx="4" fill="#161b22" stroke="#30363d"/>
<circle cx="282" cy="104" r="9" fill="#8b949e"/><path d="M266 150c0-22 7-34 16-34s16 12 16 34z" fill="#8b949e"/>
<rect x="260" y="88" width="44" height="64" fill="none" stroke="#3fb950" stroke-width="2"><animate attributeName="opacity" values="0;0;1;1" dur="3s" repeatCount="indefinite"/></rect>
<text x="260" y="170" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9" fill="#3fb950">person<animate attributeName="opacity" values="0;0;1;1" dur="3s" repeatCount="indefinite"/></text>
<g transform="translate(336 100)"><rect width="40" height="28" rx="3" fill="#161b22" stroke="#db61a2" stroke-width="2"/><path d="M0 0l20 14L40 0" fill="none" stroke="#db61a2" stroke-width="2"/>
<animate attributeName="opacity" values="0;0;0;1" dur="3s" repeatCount="indefinite"/></g>
<text x="338" y="146" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9" fill="#db61a2">alert</text>
<circle r="4" fill="#db61a2"><animateMotion dur="3s" repeatCount="indefinite" path="M94 109L150 126L250 118L336 114"/></circle>
<text x="22" y="224" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#8b949e">camera → cloud → person → email</text>
</svg>
