<svg xmlns="http://www.w3.org/2000/svg" width="400" height="240" viewBox="0 0 400 240" role="img" aria-label="Raze: duplicate, delayed and lost Razorpay webhooks hit a dedupe and reconcile shield; the order flips from pending to paid exactly once">
<title>Raze</title>
<rect x="0.5" y="0.5" width="399" height="239" rx="16" fill="#0d1117" stroke="#30363d"/>
<rect x="0.5" y="0.5" width="6" height="239" rx="3" fill="#f0883e"/>
<text x="22" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#e6edf3">Raze</text>
<text x="380" y="32" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" fill="#f0883e">RELIABLE ENGINEERING</text>

<text x="22" y="66" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9" fill="#8b949e">RAZORPAY WEBHOOKS</text>
<g transform="translate(22 80)"><g transform="translate(0 0)"><rect width="30" height="20" rx="3" fill="#161b22" stroke="#8b949e"/><path d="M0 0l15 11L30 0" fill="none" stroke="#8b949e"/></g><animateTransform attributeName="transform" type="translate" values="22 80;150 80" dur="2s" repeatCount="indefinite"/></g>
<g transform="translate(28 86)"><g transform="translate(0 0)"><rect width="30" height="20" rx="3" fill="#161b22" stroke="#8b949e"/><path d="M0 0l15 11L30 0" fill="none" stroke="#8b949e"/></g><animateTransform attributeName="transform" type="translate" values="28 86;150 86" dur="2s" begin="0.3s" repeatCount="indefinite"/></g>
<text x="60" y="122" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9" fill="#8b949e">duplicate</text>
<g transform="translate(22 136)"><g transform="translate(0 0)"><rect width="30" height="20" rx="3" fill="#161b22" stroke="#8b949e"/><path d="M0 0l15 11L30 0" fill="none" stroke="#8b949e"/></g><animateTransform attributeName="transform" type="translate" values="22 136;150 136" dur="5s" repeatCount="indefinite"/></g>
<text x="60" y="170" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9" fill="#8b949e">delayed</text>
<g transform="translate(22 176)"><g transform="translate(0 0)"><rect width="30" height="20" rx="3" fill="#161b22" stroke="#f85149"/><path d="M0 0l15 11L30 0" fill="none" stroke="#f85149"/></g><animateTransform attributeName="transform" type="translate" values="22 176;90 176" dur="2.5s" repeatCount="indefinite"/>
  <animate attributeName="opacity" values="1;1;0" dur="2.5s" repeatCount="indefinite"/></g>
<text x="104" y="190" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9" fill="#f85149">lost ✗</text>
<path d="M200 70l34 12v34c0 26-18 42-34 50-16-8-34-24-34-50V82z" fill="#161b22" stroke="#f0883e" stroke-width="2"/>
<text x="200" y="112" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9" fill="#e6edf3">dedupe</text>
<text x="200" y="124" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9" fill="#e6edf3">reconcile</text>
<path d="M200 176v14" stroke="#f0883e" stroke-dasharray="3 3"/>
<text x="200" y="204" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="8" fill="#f0883e">asks Razorpay ↺</text>
<rect x="258" y="74" width="126" height="96" rx="6" fill="#161b22" stroke="#30363d"/>
<text x="268" y="92" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9" fill="#8b949e">ORDER #1042</text>
<text x="268" y="120" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#8b949e">pending<animate attributeName="opacity" values="1;1;0;0" dur="4s" calcMode="discrete" repeatCount="indefinite"/></text>
<text x="268" y="120" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#3fb950">paid ✓ once<animate attributeName="opacity" values="0;0;1;1" dur="4s" calcMode="discrete" repeatCount="indefinite"/></text>
<text x="268" y="152" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9" fill="#8b949e">demo: 1/5 → 5/5</text>
<text x="22" y="224" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#8b949e">every payment lands exactly once</text>
</svg>
