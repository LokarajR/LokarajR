name Generate GitHub Snake

on
  schedule
    - cron 0 0   
  workflow_dispatch

jobs
  build
    runs-on ubuntu-latest
    steps
      - uses Platanesnk@v3
        with
          github_user_name LokarajR
          outputs 
            distgithub-snake-dark.svgpalette=github-dark
      - uses crazy-maxghaction-github-pages@v4
        with
          target_branch output
          build_dir dist
        env
          GITHUB_TOKEN ${{ secrets.GITHUB_TOKEN }}
